name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  terraform:
    name: Terraform formatting and validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize and validate Terraform roots and modules
        run: |
          set -euo pipefail
          while IFS= read -r directory; do
            printf 'Validating %s\n' "$directory"
            terraform -chdir="$directory" init -backend=false -input=false
            terraform -chdir="$directory" validate
          done < <(
            find environments modules -type d -name .terraform -prune -o \
              -type f -name '*.tf' -exec dirname {} \; | sort -u
          )

  checkov:
    name: Terraform and workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: python -m pip install checkov==3.3.20
      - name: Scan Terraform and GitHub Actions
        run: checkov -d . --framework terraform,github_actions --quiet --compact

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release
        run: |
          set -euo pipefail
          install_directory="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          cd "$install_directory"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --retry 3 \
            "$release_url/$archive" --output "$archive"
          curl --fail --silent --show-error --location --retry 3 \
            "$release_url/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output checksums.txt
          awk -v archive="$archive" '$2 == archive { print }' checksums.txt > archive.sha256
          sha256sum --check --strict archive.sha256
          tar -xzf "$archive" gitleaks
          printf '%s\n' "$install_directory" >> "$GITHUB_PATH"
      - name: Scan complete Git history for secrets
        run: gitleaks git --redact --verbose .
